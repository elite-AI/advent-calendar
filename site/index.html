<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>24 Films Before Christmas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="title">24 Films Before Christmas</h1>
    <p id="subtitle"></p>
  </header>
  <main>
    <ol id="grid" aria-label="Advent calendar"></ol>
  </main>
  <dialog id="box">
    <article>
      <p class="day" id="box-day"></p>
      <h2 id="box-title"></h2>
      <p id="box-text"></p>
      <button id="close" autofocus>Close</button>
    </article>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
