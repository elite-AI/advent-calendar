name: Open the daily box

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Paris midnight in December = 23:00 UTC (UTC+1).
    # GitHub may delay or skip a run, so two catch-up runs follow.
    - cron: "0 23 * * *"
    - cron: "30 23 * * *"
    - cron: "0 0 * * *"
    # Accelerated mode for the evening demo (only acts when config.json says so).
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to run
        id: gate
        run: |
          mode=$(node -p "require('./config.json').mode")
          echo "mode=$mode event=${{ github.event_name }} schedule=${{ github.event.schedule }}"
          # The 5-minute trigger only does work in accelerated mode.
          if [ "${{ github.event.schedule }}" = "*/5 * * * *" ] && [ "$mode" != "accelerated" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (only open boxes are published)
        if: steps.gate.outputs.run == 'true'
        env:
          CONTENT_JSON: ${{ secrets.CONTENT_JSON }}
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
